[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/ingestion/load_bronze.py" = ["E402"]
"src/transforms/build_silver.py" = ["E402"]
"src/transforms/build_gold.py" = ["E402"]
"src/ml/train.py" = ["E402", "I001"]
"src/ml/score.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
